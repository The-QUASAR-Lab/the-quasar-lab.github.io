# To add or edit a member, change the entries below. Fields:
#   name      - full name (required)
#   role      - title shown under the name, e.g. "PhD Student"
#   image     - photo file in assets/img/people/ (square, at least 400x400). Leave blank to show initials.
#   joined    - term the member joined the lab, e.g. "Fall 2026"
#   interests - research interests
#   education - list of degrees, one per line
#   bio       - optional extra text; Markdown links work
#   email, website - optional (full address / full URL)
#   scholar  - optional Google Scholar user ID (the part after 'user=' in the profile URL)
#   github, linkedin - optional usernames
#
